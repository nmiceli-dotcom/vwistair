[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# The report generator embeds photos, which it pulls through the Image CDN as
# downscaled JPEGs. Local site paths need no allowlisting.
[[headers]]
  for = "/api/photo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
